<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <!-- Gradiente principal da letra E: azul royal → verde esmeralda -->
    <linearGradient id="eGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#1A56DB"/>
      <stop offset="50%"  stop-color="#0D47A1"/>
      <stop offset="100%" stop-color="#00C896"/>
    </linearGradient>

    <!-- Gradiente da órbita e planeta IA -->
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0D9488"/>
      <stop offset="60%"  stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
  </defs>

  <!-- ════════════════════════════
       LETRA  E  ESTILIZADA
       com cantos arredondados
  ════════════════════════════ -->
  <path
    d="M 118 16
       C 128 16 136 24 136 34
       L 136 36
       C 136 46 128 54 118 54
       L 72 54
       C 58 54 50 63 50 78
       L 50 86
       L 102 86
       C 112 86 120 94 120 104
       C 120 114 112 122 102 122
       L 50 122
       L 50 133
       C 50 148 58 157 72 157
       L 114 157
       C 124 157 132 165 132 175
       C 132 185 124 193 114 193
       L 68 193
       C 30 193 14 172 14 140
       L 14 78
       C 14 46 30 16 68 16
       Z"
    fill="url(#eGrad)"
  />

  <!-- ════════════════════════════
       PLANETA  IA
  ════════════════════════════ -->
  <!-- Círculo do planeta -->
  <circle
    cx="142" cy="108" r="30"
    stroke="url(#orbitGrad)"
    stroke-width="4.5"
    fill="none"
  />

  <!-- Texto "IA" dentro do planeta -->
  <text
    x="142" y="118"
    text-anchor="middle"
    font-family="'Inter', 'Arial', sans-serif"
    font-weight="800"
    font-size="20"
    fill="#0D9488"
    letter-spacing="0.5"
  >IA</text>

  <!-- Órbita elíptica inclinada ao redor do planeta -->
  <ellipse
    cx="142" cy="108"
    rx="45" ry="16"
    transform="rotate(-30 142 108)"
    stroke="url(#orbitGrad)"
    stroke-width="3.5"
    fill="none"
    stroke-linecap="round"
  />

  <!-- Sparkle / Estrela de 4 pontas -->
  <path
    d="M 168 64
       C 168 70 170 73 176 73
       C 170 73 168 76 168 82
       C 168 76 166 73 160 73
       C 166 73 168 70 168 64 Z"
    fill="#10B981"
    opacity="0.95"
  />
</svg>
